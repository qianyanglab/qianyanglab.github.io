# "Collaborators" paragraph on the Research page.
# Who is listed: current collaborators, meaning the people and teams who give us data (from experiments or
# from simulations such as MD and DFT) and close methods collaborators. Students, postdocs and staff
# scientists are listed when they work with us directly.
#
#   intro    the sentence before the list
#   people   listed alphabetically by `sort` (last name); several names can share one entry
#   org      "UConn" + department or center acronym for UConn people, otherwise the organization;
#            it may hold a link, written [text](url)
#   url      a profile or lab page (a name without a url shows as plain text)
#   labs     teams named at the end of the list
