# Group members. Photos: put a square image at static/img/people/<id>.jpg and set photo: img/people/<id>.jpg.
# Without a photo, initials are shown.
pi:
  name: Qian Yang
  id: qian-yang
  role: Associate Professor, School of Computing
  photo: img/people/qian-yang.jpg
  # Bio shown at the top of the People page (Markdown; blank line between paragraphs).
  bio: |
    Qian Yang is an Associate Professor in the School of Computing at the University of Connecticut and leads the Scientific and Computational Machine Learning Laboratory (SciMaLL). Her research lies at the intersection of computational science and the physical sciences, developing machine learning methods that build interpretable and extrapolative models from small, noisy datasets, with applications in materials, chemistry, physics, manufacturing, and biomedical engineering. She received her PhD from the Institute for Computational and Mathematical Engineering at Stanford University and was a postdoctoral scholar in the Materials Computation and Theory Group at Stanford. She holds a BA in applied mathematics with a focus in computer science from Harvard College.

    Yang has given more than 25 invited talks at venues including meetings of the Materials Research Society and the American Chemical Society, 3M, Google, Seagate, Oak Ridge and Los Alamos National Laboratories. Honors include an NSF CAREER Award (2026) and the UConn University Teaching Fellow Award (2024).

