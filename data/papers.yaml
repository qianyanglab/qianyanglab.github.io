# Papers on the Research page, one entry per paper, grouped by project. Cards list papers newest first
# (by `year`; papers from the same year keep the order they have here, so list the newer one first).
# Each paper sits on its project's card (data/projects.yaml), and on any folder card in data/lenses.yaml
# whose id it is tagged with. Its tags decide which groupings show it: in each grouping, a card shows only
# its papers tagged for that group.
#
#   project         id of the card in data/projects.yaml, or a list of ids to show the paper on several cards;
#                   leave it out for a paper that appears only on folder cards defined in data/lenses.yaml
#   year            publication year (sets the order on the card, newest first)
#   label           short citation shown as the link: "First author et al., *Journal* (year)";
#                   "A & B" for two authors; *asterisks* set the journal in italics
#   url             link to the paper ("" shows the label without a link)
#   code            optional GitHub URL; adds a Code button next to the paper
#   code_label      optional text for that button instead of "Code", e.g. "Data"
#   note            optional short line under the paper
#   idea            folders under "Three Key Ideas", given as card ids from data/lenses.yaml:
#                   sys-reduction, sys-gnn (systems); pred-hierarchical, pred-change (predictions);
#                   know-extrapolation, know-uq (knowing when it works); [] = not shown there
#   domain          folders under "Applications": characterization and catalysis (project cards), plus the
#                   card ids from data/lenses.yaml: sdl-structure-property, sdl-inverse-analysis,
#                   sdl-active-learning (self-driving labs); energy-eutectic, energy-battery, energy-zintl
#                   (energy materials); mfg-3d-printing (manufacturing);
#                   bio-vision, bio-structure (biomedical engineering); phys-dynamics, phys-conservation
#                   (physics)
#   method          folders under "Methods": model-reduction (with equation discovery), vision, gnn,
#                   active-learning ([] = not shown there)
#   source          simulation and/or experiment (markers on the card)
#   image           optional figure under static/, e.g. img/projects/kmc.png. A card shows its own figure if it
#                   sets one, else the figure of its first listed paper that has one; with none, a generated pattern.
#   image_credit    source line for the figure
#   image_fit       "contain" shows the whole figure in the thumbnail
#   image_position  crop anchor for the thumbnail, e.g. "top" or "30% 40%"

